resources:
  jobs:
    multihop_workflow:
      name: multihop_workflow
      email_notifications:
        on_failure:
          - naval.datamaster@gmail.com
      schedule:
        quartz_cron_expression: 0 0 6,18 ? * MON-FRI
        timezone_id: Asia/Calcutta
        pause_status: PAUSED
      tasks:
        - task_key: ingestion
          notebook_task:
            notebook_path: /Workspace/Users/naval.datamaster@gmail.com/cyntexa/Cyntexa/day6_medallion_archtiecture/ingestion
              to bronze
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: ingestion_environment
        - task_key: silver
          depends_on:
            - task_key: ingestion
          notebook_task:
            notebook_path: /Workspace/Users/naval.datamaster@gmail.com/cyntexa/Cyntexa/day6_medallion_archtiecture/bronze_silver
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: /Workspace/Users/naval.datamaster@gmail.com/cyntexa/Cyntexa/day6_medallion_archtiecture/gold
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
      queue:
        enabled: true
      parameters:
        - name: catalog
          default: dev
      environments:
        - environment_key: ingestion_environment
          spec:
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
